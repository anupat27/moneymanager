<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Transaction</title>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'emerald': {
                            50: '#f0fdf4',
                            100: '#dcffe6',
                            200: '#c0f7d5',
                            300: '#94ecba',
                            400: '#5ad996',
                            500: '#10b981', /* Primary Green */
                            600: '#0ea478',
                            700: '#0d8564',
                            800: '#0e674e',
                            900: '#0d533f',
                            950: '#063026',
                        },
                        'red': {
                            100: '#fee2e2',
                            600: '#dc2626',
                            800: '#991b1b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

    <!-- Delete Confirmation Card -->
    <div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-red-600">

        <h1 class="text-3xl font-bold text-red-800 mb-6 pb-3 border-b border-red-100">
            <span class="inline-block mr-2 text-red-600">⚠️</span>
            Confirm Deletion
        </h1>
        
        <p class="text-lg text-gray-700 mb-6">
            Are you absolutely sure you want to delete this transaction? This action cannot be undone.
        </p>

        <!-- Transaction Details -->
        <div class="space-y-3 p-4 bg-red-50 border border-red-200 rounded-lg mb-8">
            <p class="text-base font-semibold text-red-800">
                Description: <span class="font-normal text-gray-800">{{ transaction.description }}</span>
            </p>
            <p class="text-base font-semibold text-red-800">
                Amount: <span class="font-normal text-gray-800 text-xl">-${{ transaction.amount }}</span>
            </p>
        </div>

        <form action="{% url 'delete_transaction' transaction.id %}" method="post">
            {% csrf_token %}
            
            <button type="submit" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg 
                           transition duration-200 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-4 
                           focus:ring-red-200">
                Confirm Delete
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'dashboard' %}" 
               class="text-emerald-600 hover:text-emerald-800 text-sm font-medium transition duration-200">
                Cancel
            </a>
        </div>
    </div>

</body>
</html>
